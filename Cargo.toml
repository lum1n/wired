[workspace]
resolver = "3"
members = ["crates/*", "bindings/node", "bindings/swift/ffi"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
iroh = "=1.3.0"
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
hmac = "0.13"
sha2 = "0.11"
data-encoding = "2"
rand = "0.10"
tracing = "0.1"
thiserror = "2"
rcgen = "0.14"
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
url = "2"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "std", "ring"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wired-core = { path = "crates/wired-core" }
wired = { path = "crates/wired" }
